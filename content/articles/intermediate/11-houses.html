<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Would You Swap? Two Homes, Two Lives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF6F1; --paper:#FFFFFF; --ink:#1B2440; --muted:#4B5677; --line:#DCD3F5; --line2:#E3E6F0;
  --sun:#FFC93C; --sun-soft:#FFF1BF;
  --coral:#F0525B; --coral-soft:#FFE1E3;
  --teal:#0C8F8A; --teal-soft:#D3F4F0;
  --violet:#6D4CFF; --violet-soft:#E8E2FF;
  --green:#58B90A; --green-dark:#46A302; --green-soft:#DBF5E5;
  --blue:#1CB0F6; --blue-dark:#1899D6; --blue-soft:#DDF4FF;
  --ok:#1A8552; --bad:#D0303F; --okbar:#D7FFB8; --badbar:#FFDFE0;
  --g1:#0B7A75; --g2:#1E8E5A;
  --shadow:0 6px 0 var(--line);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1428; --paper:#1A2140; --ink:#EEF1FF; --muted:#A9B3D6; --line:#2C3559; --line2:#2C3559;
    --sun-soft:#3B3413; --coral-soft:#40212A; --teal-soft:#123B3B; --violet-soft:#2B2562; --green-soft:#153A29; --blue-soft:#0F3348;
    --ok:#4ADE9A; --bad:#FF7A88; --okbar:#1D3A1A; --badbar:#3E1D22;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1428; --paper:#1A2140; --ink:#EEF1FF; --muted:#A9B3D6; --line:#2C3559; --line2:#2C3559;
  --sun-soft:#3B3413; --coral-soft:#40212A; --teal-soft:#123B3B; --violet-soft:#2B2562; --green-soft:#153A29; --blue-soft:#0F3348;
  --ok:#4ADE9A; --bad:#FF7A88; --okbar:#1D3A1A; --badbar:#3E1D22;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:84px}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif; font-size:18px; line-height:1.6; overflow-x:hidden}
h1,h2,h3,h4{font-family:"Baloo 2","Trebuchet MS","Segoe UI",sans-serif; line-height:1.15; margin:0}
button{font:inherit; color:inherit}
.wrap{max-width:900px; margin:0 auto; padding:0 16px}
:focus-visible{outline:3px solid var(--violet); outline-offset:3px; border-radius:8px}

/* ---------- top bar ---------- */
.topbar{position:sticky; top:0; z-index:50; background:var(--bg); background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:2px solid var(--line2)}
.topbar .wrap{display:flex; align-items:center; gap:12px; height:62px}
.tb-home{font-size:1.6rem; text-decoration:none; line-height:1}
.pbar{flex:1; height:16px; background:var(--line2); border-radius:99px; overflow:hidden; position:relative}
.pbar i{position:absolute; inset:0 auto 0 0; width:0; background:var(--green); border-radius:99px; transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.pbar i::after{content:""; position:absolute; left:10px; right:10px; top:4px; height:4px; border-radius:99px; background:rgba(255,255,255,.4)}
.stat{display:flex; align-items:center; gap:4px; font-weight:800; font-family:"Baloo 2",sans-serif; font-size:1.15rem; white-space:nowrap}
.stat .e{font-size:1.3rem; display:inline-block}
.stat.fire{color:#FF9600}
.stat.fire.cold{color:var(--muted); filter:grayscale(1); opacity:.6}
.stat.xp{color:var(--blue-dark)}
.icon-btn{border:0; background:transparent; font-size:1.25rem; cursor:pointer; padding:6px; border-radius:10px}
.icon-btn:hover{background:var(--line2)}
.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}

/* ---------- hero ---------- */
.hero{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 100%); color:#fff; padding:30px 0 40px; border-radius:0 0 42px 42px; position:relative; overflow:hidden}
.hero::before,.hero::after{content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.08)}
.hero::before{width:320px; height:320px; right:-80px; top:-120px}
.hero::after{width:180px; height:180px; left:-60px; bottom:-90px}
.hero .wrap{display:grid; grid-template-columns:1.4fr 1fr; gap:20px; align-items:center; position:relative; z-index:1}
.level{display:inline-block; background:var(--sun); color:#1B2440; font-weight:800; padding:4px 14px; border-radius:99px; margin-bottom:12px; font-size:.9rem}
.hero h1{font-size:clamp(2rem,5.6vw,3.1rem); font-weight:800}
.hero p{margin:10px 0 0; font-size:1.08rem; max-width:40ch; opacity:.95}
.hero-emo{font-size:7.5rem; line-height:1; text-align:center; filter:drop-shadow(0 10px 0 rgba(0,0,0,.15)); animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.hero-meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.hero-meta span{background:rgba(255,255,255,.18); border-radius:99px; padding:4px 12px; font-weight:700; font-size:.92rem}
.hero .btn3d{margin-top:20px}
.mascot{display:flex; align-items:flex-end; gap:10px; margin-top:18px}
.mascot .m{font-size:2.6rem; line-height:1}
.mascot .bubble{background:#fff; color:#1B2440; border-radius:18px 18px 18px 4px; padding:8px 14px; font-weight:700; font-size:.98rem; box-shadow:0 4px 0 rgba(0,0,0,.12)}

/* ---------- buttons ---------- */
.btn3d{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; cursor:pointer; font-family:"Nunito",sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:.04em; font-size:.95rem; padding:13px 26px; border-radius:16px; background:var(--green); color:#fff; box-shadow:0 5px 0 var(--green-dark); transition:transform .08s, box-shadow .08s, filter .15s}
.btn3d:hover{filter:brightness(1.06)}
.btn3d:active{transform:translateY(4px); box-shadow:0 1px 0 var(--green-dark)}
.btn3d[disabled]{background:var(--line2); color:var(--muted); box-shadow:0 5px 0 var(--line); cursor:not-allowed; filter:none; transform:none}
.btn3d.blue{background:var(--blue); box-shadow:0 5px 0 var(--blue-dark)}
.btn3d.red{background:#FF4B4B; box-shadow:0 5px 0 #EA2B2B}
.btn3d.white{background:#fff; color:#1B2440; box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn3d.ghost{background:var(--paper); color:var(--ink); box-shadow:0 5px 0 var(--line); border:2px solid var(--line)}
.btn3d.sm{padding:8px 16px; font-size:.82rem; border-radius:12px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

/* ---------- path ---------- */
.pathcard{margin-top:-26px; position:relative; z-index:2}
.path{display:flex; gap:6px; overflow-x:auto; padding:14px 6px 8px; scrollbar-width:thin}
.node{flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; width:74px; text-decoration:none; color:var(--ink); position:relative}
.node .c{width:58px; height:58px; border-radius:50%; display:grid; place-items:center; font-size:1.7rem; background:var(--line2); box-shadow:0 5px 0 var(--line); transition:transform .15s; position:relative}
.node:hover .c{transform:translateY(-3px)}
.node .l{font-size:.74rem; font-weight:800; text-align:center; line-height:1.15; color:var(--muted)}
.node.done .c{background:var(--sun); box-shadow:0 5px 0 #E0A800}
.node.done .c::after{content:"✓"; position:absolute; right:-4px; top:-4px; width:22px; height:22px; border-radius:50%; background:var(--green); color:#fff; font-size:.8rem; display:grid; place-items:center; font-weight:900; border:2px solid var(--paper)}
.node.next .c{background:var(--green); box-shadow:0 5px 0 var(--green-dark); animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.node:not(:last-child)::after{content:""; position:absolute; top:28px; left:66px; width:14px; height:4px; border-radius:2px; background:var(--line)}

/* ---------- cards / sections ---------- */
section{margin:40px 0}
.card{background:var(--paper); border-radius:26px; padding:26px 28px; box-shadow:var(--shadow)}
.sec-title{font-size:2rem; display:flex; align-items:center; gap:10px}
.lead{color:var(--muted); margin:4px 0 18px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px}
.chip{border:2px solid var(--line); background:var(--paper); border-radius:99px; padding:5px 14px; font-weight:800; font-size:.9rem; cursor:pointer}
.chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* flip cards */
.fgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px}
.flip{perspective:900px; height:168px; cursor:pointer; border:0; background:none; padding:0; text-align:center}
.flip .in{position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.3,1.4,.5,1); transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; box-shadow:0 5px 0 var(--line)}
.flip .f{background:var(--sun-soft)}
.flip:nth-child(5n+2) .f{background:var(--coral-soft)} .flip:nth-child(5n+3) .f{background:var(--violet-soft)}
.flip:nth-child(5n+4) .f{background:var(--teal-soft)} .flip:nth-child(5n+5) .f{background:var(--green-soft)}
.flip .f .emo{font-size:2.6rem; line-height:1.1}
.flip .f b{font-family:"Baloo 2",sans-serif; font-size:1.18rem; line-height:1.15; margin-top:6px}
.flip .b{transform:rotateY(180deg); background:var(--paper); border:3px solid var(--violet); font-size:.92rem; line-height:1.35; color:var(--ink)}
.flip .b small{display:block; color:var(--violet); font-weight:800; margin-bottom:4px; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em}
.flip.seen .f::after{content:"✓"; position:absolute; top:8px; right:10px; font-weight:900; color:var(--ok)}
.say{border:0; background:rgba(255,255,255,.7); border-radius:99px; width:34px; height:34px; display:inline-grid; place-items:center; cursor:pointer; font-size:1rem; position:absolute; top:8px; left:8px}
:root[data-theme="dark"] .say{background:rgba(0,0,0,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .say{background:rgba(0,0,0,.25)}}
.counter{display:flex; align-items:center; gap:10px; font-weight:800; margin:16px 0 0}
.mini{flex:1; height:10px; background:var(--line2); border-radius:99px; overflow:hidden}
.mini i{display:block; height:100%; width:0; background:var(--blue); border-radius:99px; transition:width .4s}
.tips{list-style:none; padding:0; margin:18px 0 0; display:grid; gap:10px}
.tips li{display:flex; gap:14px; align-items:flex-start; padding:12px 16px; border-radius:18px; background:var(--teal-soft)}
.tips li:nth-child(even){background:var(--violet-soft)}
.tips .emo{font-size:1.8rem; line-height:1.2}
.tips b{display:block; font-family:"Baloo 2",sans-serif; font-size:1.08rem; line-height:1.2}
.note{background:var(--blue-soft); border-left:6px solid var(--blue); border-radius:14px; padding:12px 16px; margin:14px 0 0; font-size:.98rem}
.note b{font-family:"Baloo 2",sans-serif; font-size:1.05rem}

/* article */
.art-head{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:6px}
.hunt{position:sticky; top:70px; z-index:5; background:var(--sun-soft); border-radius:16px; padding:8px 14px; display:flex; align-items:center; gap:10px; font-weight:800; font-size:.95rem; margin:6px 0 18px; box-shadow:0 4px 0 rgba(0,0,0,.06)}
article .asec{position:relative; margin:0 0 8px}
article h3{font-size:1.5rem; margin:22px 0 8px; color:var(--violet); display:flex; gap:8px; align-items:center}
:root[data-theme="dark"] article h3{color:#B7A6FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) article h3{color:#B7A6FF}}
article p{margin:0 0 12px}
.wd{all:unset; cursor:pointer; background:var(--sun-soft); border-bottom:3px solid var(--sun); padding:0 3px; border-radius:5px; font-weight:800; transition:background .2s}
.wd:hover{background:var(--sun)}
.wd.found{background:var(--green-soft); border-bottom-color:var(--green)}
.wd:focus-visible{outline:3px solid var(--violet)}
.asec.locked .body{filter:blur(6px); user-select:none; pointer-events:none; opacity:.55}
.asec .lock{display:none}
.asec.locked .lock{display:flex; position:absolute; inset:40px 0 auto 0; justify-content:center; z-index:2}
.lock span{background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:99px; font-weight:800; box-shadow:0 5px 0 rgba(0,0,0,.2)}
.pic{float:right; width:150px; height:110px; margin:4px 0 10px 16px; border-radius:20px; display:grid; place-items:center; font-size:3.4rem; background:var(--teal-soft)}
.cp{clear:both; background:var(--violet-soft); border-radius:20px; padding:16px 18px; margin:16px 0 8px}
.cp .t{font-weight:900; font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; color:var(--violet)}
:root[data-theme="dark"] .cp .t{color:#B7A6FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cp .t{color:#B7A6FF}}
.cp .q{font-weight:800; margin:4px 0 10px}
.cp .opts{display:grid; gap:8px}
.cp .fbk{font-weight:800; margin-top:8px}
.pop{position:absolute; z-index:60; width:270px; background:var(--paper); border-radius:20px; padding:14px 16px; box-shadow:0 10px 30px rgba(0,0,0,.25); border:3px solid var(--violet); animation:popin .2s ease}
@keyframes popin{from{transform:scale(.85); opacity:0}to{transform:scale(1); opacity:1}}
.pop .e{font-size:2.2rem; line-height:1}
.pop b{font-family:"Baloo 2",sans-serif; font-size:1.3rem; display:block}
.pop p{margin:4px 0 8px; font-size:.95rem; color:var(--muted)}

/* activities */
.ex{margin:36px 0}
.ex-head{display:flex; gap:14px; align-items:center; padding:16px 20px; border-radius:24px 24px 0 0; color:#fff}
.ex-head h3{font-size:1.45rem}
.ex-head p{margin:2px 0 0; opacity:.95; font-size:.96rem; line-height:1.35}
.badge{flex:none; width:50px; height:50px; border-radius:16px; background:#fff; display:grid; place-items:center; font-size:1.7rem; box-shadow:0 4px 0 rgba(0,0,0,.15)}
.c0{background:#0C8F8A} .c1{background:#E0454F} .c2{background:#6D4CFF} .c3{background:#2E8B57} .c4{background:#1899D6} .c5{background:#D9780B}
.ex-body{background:var(--paper); padding:22px 24px 24px; border-radius:0 0 24px 24px; box-shadow:var(--shadow); position:relative}
.ex.done .ex-head h3::after{content:" ✅"}
.best{font-size:.85rem; font-weight:800; background:rgba(255,255,255,.22); padding:2px 10px; border-radius:99px; margin-left:auto; white-space:nowrap}

/* stepper */
.dots{display:flex; gap:5px; margin-bottom:16px}
.dots i{flex:1; height:8px; border-radius:99px; background:var(--line2); transition:background .3s}
.dots i.ok{background:var(--green)} .dots i.bad{background:#FF4B4B} .dots i.cur{background:var(--blue)}
.stage{min-height:180px}
.prompt{font-size:1.2rem; font-weight:800; margin:0 0 14px; line-height:1.45}
.prompt.big{font-size:3rem; text-align:center; letter-spacing:.1em; line-height:1.2}
.prompt .sub{display:block; font-size:.92rem; font-weight:700; color:var(--muted); letter-spacing:0; margin-top:4px}
.blank{display:inline-block; min-width:90px; border-bottom:3px solid var(--ink); text-align:center; padding:0 6px; color:var(--blue-dark); transition:all .2s}
.blank.filled{border-bottom-color:var(--blue)}
.choices{display:grid; gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ch{border:2px solid var(--line2); border-bottom-width:5px; background:var(--paper); border-radius:16px; padding:12px 16px; font-weight:700; text-align:left; cursor:pointer; transition:transform .08s, background .15s, border-color .15s; display:flex; align-items:center; gap:10px; line-height:1.35}
.ch:hover{background:var(--line2)}
.ch:active{transform:translateY(2px)}
.ch .k{flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--line2); display:grid; place-items:center; font-size:.8rem; color:var(--muted)}
.ch.sel{border-color:var(--blue); background:var(--blue-soft); color:var(--blue-dark)}
:root[data-theme="dark"] .ch.sel{color:#8FD9FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ch.sel{color:#8FD9FF}}
.ch.right{border-color:var(--green); background:var(--green-soft)}
.ch.wrong{border-color:#FF4B4B; background:var(--coral-soft)}
.ch.big{justify-content:center; font-size:1.15rem; font-weight:800; padding:18px}
.ch[disabled]{cursor:default}
.checkbar{margin:20px -24px -24px; padding:16px 24px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; border-top:2px solid var(--line2); transition:background .25s}
.checkbar.ok{background:var(--okbar); border-top-color:transparent}
.checkbar.bad{background:var(--badbar); border-top-color:transparent}
.checkbar .msg{flex:1; min-width:180px; font-weight:800}
.checkbar .msg .h{font-family:"Baloo 2",sans-serif; font-size:1.35rem; display:block; line-height:1.2}
.checkbar.ok .msg{color:#3B8B00} .checkbar.bad .msg{color:#D0303F}
:root[data-theme="dark"] .checkbar.ok .msg{color:#7EE04A} :root[data-theme="dark"] .checkbar.bad .msg{color:#FF8A95}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .checkbar.ok .msg{color:#7EE04A} :root:not([data-theme="light"]) .checkbar.bad .msg{color:#FF8A95}}
.checkbar .btn3d{margin-left:auto; min-width:150px}
.slideup{animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(12px); opacity:.3}to{transform:none; opacity:1}}
.tin{width:100%; font:inherit; font-size:1.15rem; font-weight:700; padding:12px 16px; border-radius:16px; border:2px solid var(--line2); border-bottom-width:5px; background:var(--paper); color:var(--ink)}
.tin:focus{outline:none; border-color:var(--blue)}
.hintbtn{margin-top:10px}
.tiles{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:56px; padding:8px}
.answer-row{border-bottom:3px solid var(--line2); border-top:3px solid var(--line2); margin-bottom:14px; justify-content:flex-start}
.tile{border:2px solid var(--line2); border-bottom-width:5px; border-radius:14px; background:var(--paper); padding:8px 14px; font-weight:800; cursor:pointer; font-size:1.05rem; min-width:44px; transition:transform .1s}
.tile:active{transform:translateY(2px)}
.tile.used{visibility:hidden}
.tile.letter{text-transform:lowercase; font-size:1.3rem; min-width:46px}
.speaker{display:flex; gap:12px; justify-content:center; margin:6px 0 18px}
.speaker button{width:86px; height:86px; border-radius:24px; border:0; font-size:2.4rem; cursor:pointer; background:var(--blue); box-shadow:0 6px 0 var(--blue-dark)}
.speaker button.slow{width:62px; height:62px; font-size:1.6rem; align-self:flex-end}
.speaker button:active{transform:translateY(4px); box-shadow:0 2px 0 var(--blue-dark)}
.summary{text-align:center; padding:10px 0}
.summary .e{font-size:4.2rem; line-height:1; animation:bump .8s ease}
.summary h4{font-size:2rem; margin:8px 0 2px}
.summary .stars{font-size:2rem; letter-spacing:.1em}
.summary p{color:var(--muted); margin:4px 0 16px}

/* match */
.match{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.match .col{display:grid; gap:10px; align-content:start}
.mt{border:2px solid var(--line2); border-bottom-width:5px; border-radius:16px; background:var(--paper); padding:12px; font-weight:800; cursor:pointer; text-align:center; line-height:1.3; min-height:56px; transition:all .15s}
.mt.def{font-weight:600; font-size:.92rem}
.mt.sel{border-color:var(--blue); background:var(--blue-soft)}
.mt.good{border-color:var(--green); background:var(--green-soft); opacity:.45; cursor:default}
.mt.bad{border-color:#FF4B4B; background:var(--coral-soft)}
.mhead{display:flex; justify-content:space-between; font-weight:800; margin-bottom:12px; color:var(--muted)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* sort */
.pool{display:flex; flex-wrap:wrap; gap:8px; padding:14px; border-radius:18px; background:var(--line2); min-height:64px; margin-bottom:16px; justify-content:center}
.sc{border:2px solid var(--line2); border-bottom-width:5px; border-radius:14px; background:var(--paper); padding:7px 14px; font-weight:800; cursor:pointer; font-size:1rem}
.sc.sel{border-color:var(--blue); background:var(--blue-soft); transform:translateY(-3px)}
.buckets{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.bucket{border:3px dashed var(--line); border-radius:20px; padding:10px; min-height:120px; cursor:pointer; background:var(--paper); transition:background .15s}
.bucket:hover,.bucket.hot{background:var(--blue-soft); border-color:var(--blue)}
.bucket h5{margin:0 0 8px; font-family:"Baloo 2",sans-serif; font-size:1.15rem; text-align:center}
.bucket .in{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.bucket .in span{background:var(--green-soft); border-radius:10px; padding:3px 10px; font-weight:700; font-size:.88rem}

/* order */
.slots{display:grid; gap:8px; margin-bottom:14px; counter-reset:s}
.slot{counter-increment:s; display:flex; align-items:center; gap:10px; min-height:52px; border:3px dashed var(--line); border-radius:16px; padding:6px 12px; font-weight:700}
.slot::before{content:counter(s); flex:none; width:30px; height:30px; border-radius:50%; background:var(--sun); color:#1B2440; display:grid; place-items:center; font-weight:900; font-size:.9rem}
.slot.filled{border-style:solid; border-color:var(--line2); background:var(--paper); cursor:pointer}
.slot.right{border-color:var(--green); background:var(--green-soft)}
.slot.wrong{border-color:#FF4B4B; background:var(--coral-soft)}
.slot .fix{margin-left:auto; font-size:.82rem; color:var(--ok); font-weight:800}

/* scenes */
.scene{border-radius:20px; margin-bottom:18px; overflow:hidden; position:relative}
.race{background:linear-gradient(#9FE07A,#7BC95A); height:92px; padding:0 14px}
.race .road{position:absolute; left:0; right:0; top:28px; height:40px; background:#555E6E; border-top:4px solid #fff; border-bottom:4px solid #fff}
.race .road::after{content:""; position:absolute; left:0; right:0; top:16px; height:4px; background:repeating-linear-gradient(90deg,#FFD84C 0 24px,transparent 24px 44px)}
.race .car{position:absolute; top:22px; font-size:2.6rem; line-height:1; transition:left .7s cubic-bezier(.3,1.5,.5,1); transform:scaleX(-1); z-index:2}
.race .car.noflip{transform:none}
.race .goal{position:absolute; right:10px; top:20px; font-size:2.6rem; z-index:1}
.pitch{background:linear-gradient(#2E8B57,#3BA76A); height:150px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; color:#fff}
.pitch .goalbox{font-size:4.6rem; position:relative; line-height:1}
.pitch .keeper{position:absolute; left:50%; top:30%; font-size:2.2rem; transform:translateX(-50%); transition:transform .45s}
.pitch .ball{font-size:2.2rem; position:absolute; left:46%; bottom:14px; transition:all .6s cubic-bezier(.2,.8,.3,1)}
.pitch .score{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.25rem; background:rgba(0,0,0,.25); padding:6px 14px; border-radius:14px; text-align:center; line-height:1.2}
.pitch .shout{position:absolute; left:0; right:0; top:8px; text-align:center; font-family:"Baloo 2",sans-serif; font-size:2rem; font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.25); opacity:0; transition:opacity .2s}
.pitch .shout.on{opacity:1; animation:bump .6s}

/* hotspot */
.hs-wrap{display:grid; grid-template-columns:1.1fr 1fr; gap:18px; align-items:center}
.hs-svg{width:100%; max-width:380px; margin:0 auto; display:block}
.hs-svg [data-part]{cursor:pointer; transition:filter .15s, opacity .15s}
.hs-svg [data-part]:hover{filter:brightness(1.15) drop-shadow(0 0 4px #1CB0F6)}
.hs-svg .hit{fill:transparent}
.hs-svg .hl{animation:hl 1s ease 2}
.hs-svg .flash-ok{filter:drop-shadow(0 0 8px #58CC02) brightness(1.2)}
.hs-svg .flash-bad{filter:drop-shadow(0 0 8px #FF4B4B)}
@keyframes hl{50%{filter:drop-shadow(0 0 10px #FFC93C) brightness(1.3)}}
.hs-q{text-align:center}
.hs-q .lbl{font-family:"Baloo 2",sans-serif; font-size:2.2rem; color:var(--blue-dark); line-height:1.1; margin:6px 0 10px; display:block}

/* table */
.wtable{width:100%; border-collapse:separate; border-spacing:0 8px}
.wtable th{text-align:left; font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:0 8px}
.wtable td{padding:4px 6px; font-weight:800}
.wtable td:first-child{font-family:"Baloo 2",sans-serif; font-size:1.1rem}
.wtable input{width:100%; font:inherit; font-weight:700; padding:8px 10px; border-radius:12px; border:2px solid var(--line2); border-bottom-width:4px; background:var(--paper); color:var(--ink); min-width:90px}
.wtable input.right{border-color:var(--green); background:var(--green-soft)}
.wtable input.wrong{border-color:#FF4B4B; background:var(--coral-soft)}
.wtable .given{color:var(--muted); font-weight:700}
.tscroll{overflow-x:auto}

/* speak */
.speak-list{display:grid; gap:10px}
.sp{display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:16px; border:2px solid var(--line2); flex-wrap:wrap}
.sp b{font-family:"Baloo 2",sans-serif; font-size:1.2rem; flex:1; min-width:120px}
.sp .heard{width:100%; font-size:.88rem; color:var(--muted); font-weight:700}
.sp.ok{border-color:var(--green); background:var(--green-soft)}
.sp.no{border-color:#FF4B4B}
.mic{border:0; width:46px; height:46px; border-radius:14px; background:#FF4B4B; color:#fff; font-size:1.3rem; cursor:pointer; box-shadow:0 4px 0 #C42B2B}
.mic.rec{animation:pulse .8s infinite}

/* write */
.talk{display:grid; gap:10px; padding-left:0; list-style:none; margin:0 0 18px}
.talk li{padding:12px 16px; background:var(--green-soft); border-radius:16px; font-weight:700}
.wbox{width:100%; min-height:170px; font:inherit; padding:14px 16px; border-radius:18px; border:2px solid var(--line2); border-bottom-width:5px; background:var(--paper); color:var(--ink); resize:vertical; line-height:1.55}
.wbox:focus{outline:none; border-color:var(--blue)}
.targets{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0}
.targets span{padding:4px 10px; border-radius:99px; background:var(--line2); font-weight:700; font-size:.85rem; transition:all .25s}
.targets span.hit{background:var(--green); color:#fff; transform:scale(1.06)}

/* finish */
.trophy{text-align:center}
.trophy .big{font-size:5.5rem; line-height:1}
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:18px 0}
.sbox{border:2px solid var(--line2); border-radius:18px; padding:12px; text-align:center}
.sbox .n{font-family:"Baloo 2",sans-serif; font-size:1.8rem; font-weight:800; line-height:1.1; display:block}
.sbox .t{font-size:.82rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
.cert{border:4px double var(--sun); border-radius:22px; padding:22px; background:var(--sun-soft); margin-top:16px; text-align:center}
.cert h4{font-size:1.6rem}
.cert .nm{font-family:"Baloo 2",sans-serif; font-size:1.9rem; color:var(--violet); border-bottom:2px dashed var(--violet); display:inline-block; min-width:200px; margin:6px 0}
.namein{font:inherit; font-weight:800; padding:10px 14px; border-radius:14px; border:2px solid var(--line2); background:var(--paper); color:var(--ink); width:min(320px,100%)}
.badges{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:12px}
.bdg{display:flex; flex-direction:column; align-items:center; width:92px; font-size:.75rem; font-weight:800; color:var(--muted); text-align:center; line-height:1.2; filter:grayscale(1); opacity:.45}
.bdg .e{font-size:2.2rem; width:62px; height:62px; border-radius:50%; background:var(--line2); display:grid; place-items:center; margin-bottom:4px}
.bdg.got{filter:none; opacity:1; color:var(--ink)}
.bdg.got .e{background:var(--sun); box-shadow:0 4px 0 #E0A800}

/* fx */
.toast{position:fixed; left:50%; top:76px; transform:translate(-50%,-20px); z-index:90; background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:18px; font-weight:800; display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transition:all .3s cubic-bezier(.3,1.5,.5,1); pointer-events:none; max-width:92vw}
.toast.on{opacity:1; transform:translate(-50%,0)}
.toast .m{font-size:1.6rem}
.floaty{position:fixed; z-index:95; pointer-events:none; font-size:2rem; animation:floaty 1.1s ease-out forwards}
.floaty.txt{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.2rem; color:var(--blue-dark)}
@keyframes floaty{0%{transform:translate(-50%,0) scale(.6); opacity:0}15%{opacity:1; transform:translate(-50%,-10px) scale(1.2)}100%{transform:translate(calc(-50% + var(--dx,0px)),-110px) scale(1); opacity:0}}
.streakpop{position:fixed; inset:0; z-index:96; display:grid; place-items:center; pointer-events:none}
.streakpop div{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(2.4rem,9vw,4.4rem); color:#FF9600; text-shadow:0 5px 0 rgba(0,0,0,.18); animation:spop 1.3s ease forwards; text-align:center; line-height:1.05}
.streakpop small{display:block; font-size:.4em; color:var(--ink)}
@keyframes spop{0%{transform:scale(.3); opacity:0}20%{transform:scale(1.15); opacity:1}70%{transform:scale(1); opacity:1}100%{transform:scale(.9) translateY(-40px); opacity:0}}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:99}
footer{text-align:center; color:var(--muted); font-size:.9rem; padding:10px 0 50px}
footer a{color:inherit}

@media (max-width:720px){
  body{font-size:17px}
  .hero .wrap{grid-template-columns:1fr}
  .hero-emo{font-size:4.6rem; order:-1; text-align:left}
  .card{padding:20px 16px}
  .ex-body{padding:18px 14px 20px}
  .checkbar{margin:18px -14px -20px; padding:14px}
  .checkbar .btn3d{width:100%; margin-left:0}
  .pic{width:100px; height:80px; font-size:2.4rem}
  .hs-wrap{grid-template-columns:1fr}
  .match{gap:8px} .mt{padding:10px 8px; font-size:.92rem} .mt.def{font-size:.84rem}
  .stat{font-size:1rem} .topbar .wrap{gap:8px}
  .fgrid{grid-template-columns:repeat(2,1fr)}
  .flip{height:156px}
  .prompt.big{font-size:2.4rem}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important}}

<script>
(function(){
'use strict';
var U = window.UNIT;
var KEY = 'efvocab-v1-' + U.id;
var S = load();
if(!S || typeof S !== 'object') S = {};
S.xp = S.xp||0; S.done = S.done||{}; S.flipped = S.flipped||{}; S.found = S.found||{}; S.cp = S.cp||{};
S.best = S.best||0; S.right = S.right||0; S.wrong = S.wrong||0; S.badges = S.badges||{};
var streak = 0, muted = false;
try{ muted = localStorage.getItem('efvocab-mute')==='1'; }catch(e){}

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------------- helpers ---------------- */
function h(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function norm(s){ return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim(); }
function ansText(it){ return typeof it.a==='number' && it.o ? it.o[it.a] : it.a; }
var WORDS = U.words, WMAP = {};
WORDS.forEach(function(w){ WMAP[w.w.toLowerCase()] = w; });

/* ---------------- sound ---------------- */
var AC=null;
function tone(fs, dur, type, gap, vol){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var t=AC.currentTime;
    fs.forEach(function(f,i){
      var o=AC.createOscillator(), g=AC.createGain(), st=t+i*gap;
      o.type=type||'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(vol||0.16,st+0.02); g.gain.exponentialRampToValueAtTime(0.0001,st+dur);
      o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st+dur+0.05);
    });
  }catch(e){}
}
var sfx = {
  ok:function(){ tone([659,988],0.22,'sine',0.09,0.18); },
  bad:function(){ tone([220,165],0.25,'triangle',0.12,0.2); },
  pop:function(){ tone([880],0.08,'sine',0,0.08); },
  flip:function(){ tone([520,700],0.08,'sine',0.04,0.06); },
  win:function(){ tone([523,659,784,1047,1319],0.3,'triangle',0.1,0.16); },
  streak:function(){ tone([784,988,1175,1568],0.18,'square',0.07,0.06); }
};

/* ---------------- speech ---------------- */
var voice=null, hasTTS = ('speechSynthesis' in window);
function pickVoice(){
  try{ var vs=speechSynthesis.getVoices();
    voice = vs.filter(function(v){return /en[-_]GB/i.test(v.lang);})[0] || vs.filter(function(v){return /^en/i.test(v.lang);})[0] || null;
  }catch(e){}
}
if(hasTTS){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function say(text, slow){
  if(!hasTTS){ toast('🔇', 'Sorry, this browser cannot speak.'); return; }
  try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,'').replace(/\bsth\b/g,'something').replace(/\bsb\b/g,'somebody'));
    u.lang='en-GB'; if(voice) u.voice=voice; u.rate = slow?0.62:0.92; speechSynthesis.speak(u); }catch(e){}
}

/* ---------------- fx ---------------- */
var toastEl, toastT;
function toast(m, txt, ms){
  if(!toastEl){ toastEl=h('div','toast'); document.body.appendChild(toastEl); }
  toastEl.innerHTML='<span class="m">'+m+'</span><span>'+txt+'</span>';
  toastEl.classList.add('on'); clearTimeout(toastT);
  toastT=setTimeout(function(){ toastEl.classList.remove('on'); }, ms||2200);
}
function centerOf(el){ var r=el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }
function floaty(el, content, isText){
  if(!el) return; var c=centerOf(el);
  var f=h('div','floaty'+(isText?' txt':''), content);
  f.style.left=c.x+'px'; f.style.top=(c.y-20)+'px';
  f.style.setProperty('--dx', (Math.random()*80-40)+'px');
  document.body.appendChild(f); setTimeout(function(){ f.remove(); }, 1150);
}
var CHEER = ['🔥','👏','🎉','💯','⭐','🤩','💪','🙌','🥳','✨'];
function cheer(el){ floaty(el, rnd(CHEER)); setTimeout(function(){ floaty(el, rnd(CHEER)); }, 140); }
function shake(el){ if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function bumpEl(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function bigPop(html){
  var p=h('div','streakpop','<div>'+html+'</div>'); document.body.appendChild(p);
  setTimeout(function(){ p.remove(); }, 1350);
}
var cv, cx, parts=[], raf=null;
function confetti(n){
  if(!cv){ cv=h('canvas'); cv.id='confetti'; document.body.appendChild(cv); cx=cv.getContext('2d'); }
  cv.width=innerWidth; cv.height=innerHeight;
  var cols=['#58CC02','#1CB0F6','#FFC93C','#FF4B4B','#6D4CFF','#FF9600','#0C8F8A'];
  for(var i=0;i<(n||150);i++){
    parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5, y:innerHeight*.35, vx:(Math.random()-.5)*16, vy:-Math.random()*16-4,
      s:Math.random()*8+5, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:rnd(cols), life:0, sh:Math.random()<.5});
  }
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(function(p){ return p.y < cv.height+40 && p.life < 260; });
  parts.forEach(function(p){
    p.vy+=0.42; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
    if(p.sh){ cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); } else { cx.beginPath(); cx.arc(0,0,p.s/2.4,0,6.28); cx.fill(); }
    cx.restore();
  });
  if(parts.length){ raf=requestAnimationFrame(loop); } else { raf=null; cx.clearRect(0,0,cv.width,cv.height); }
}

/* ---------------- XP / streak ---------------- */
var PRAISE = ['Amazing!','Nice one!','You nailed it!','Barakalla! 👏','Zo‘r! 🔥','Perfect!','Excellent!','Brilliant!','Keep going!','Ofarin! 🌟','Spot on!','Great job!'];
var OOPS = ['Not quite…','Almost!','Oops!','Close, but no…','Don’t give up!'];
var xpEl, fireEl, pbar;
function addXP(n, el){ S.xp+=n; save(); if(xpEl){ xpEl.querySelector('b').textContent=S.xp; bumpEl(xpEl.querySelector('.e')); } if(el) floaty(el,'+'+n+' XP',true); }
function onRight(el, xp){
  streak++; S.right++; if(streak>S.best) S.best=streak;
  sfx.ok(); addXP(xp===undefined?10:xp, el); cheer(el); renderFire();
  if(streak===3){ setTimeout(function(){ sfx.streak(); bigPop('🔥 3 in a row!'); },250); }
  else if(streak>3 && streak%5===0){ setTimeout(function(){ sfx.streak(); bigPop('🔥 '+streak+' streak!<small>You are on fire!</small>'); confetti(60); },250); }
  if(streak>=10) badge('streak10');
}
function onWrong(el){ if(streak>=3) toast('💔','Streak lost — start a new one!'); streak=0; S.wrong++; save(); sfx.bad(); shake(el); renderFire(); }
var finT; function refreshFin(){ clearTimeout(finT); finT=setTimeout(function(){ var a=document.activeElement; if(!(a && a.classList && a.classList.contains('namein'))) renderFinish(); },400); }
function renderFire(){ refreshFin(); if(!fireEl) return; fireEl.querySelector('b').textContent=streak; fireEl.classList.toggle('cold', streak===0); if(streak) bumpEl(fireEl.querySelector('.e')); }

var BADGES = {
  cards:{e:'🃏', n:'Card Master'}, detective:{e:'🕵️', n:'Word Detective'}, reader:{e:'📰', n:'Super Reader'},
  perfect:{e:'💯', n:'Perfect Score'}, streak10:{e:'🔥', n:'10 Streak'}, writer:{e:'✍️', n:'Word User'}, champion:{e:'🏆', n:'Unit Champion'}
};
function badge(k){
  if(S.badges[k]) return; S.badges[k]=1; save();
  setTimeout(function(){ sfx.win(); toast(BADGES[k].e,'New badge: <b>'+BADGES[k].n+'</b>!',2800); }, 600);
  renderFinish();
}

/* ---------------- layout ---------------- */
var app = document.getElementById('app');
var NODES = [];
function sectionDone(id){ return !!S.done[id]; }

function buildTop(){
  var t=h('div','topbar');
  t.innerHTML='<div class="wrap"><a class="tb-home" href="#top" title="Top">'+U.emoji+'</a>'+
    '<div class="pbar" title="Lesson progress"><i></i></div>'+
    '<span class="stat fire cold" title="Streak"><span class="e">🔥</span><b>0</b></span>'+
    '<span class="stat xp" title="XP"><span class="e">⚡</span><b>'+S.xp+'</b></span>'+
    '<button class="icon-btn" id="muteBtn" title="Sound on/off">'+(muted?'🔇':'🔊')+'</button>'+
    '<button class="icon-btn" id="themeBtn" title="Dark / light">🌓</button></div>';
  document.body.insertBefore(t, app);
  xpEl=t.querySelector('.xp'); fireEl=t.querySelector('.fire'); pbar=t.querySelector('.pbar i');
  t.querySelector('#muteBtn').onclick=function(){ muted=!muted; this.textContent=muted?'🔇':'🔊'; try{localStorage.setItem('efvocab-mute',muted?'1':'0');}catch(e){} };
  t.querySelector('#themeBtn').onclick=function(){
    var r=document.documentElement, dark = r.getAttribute('data-theme') ? r.getAttribute('data-theme')==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.setAttribute('data-theme', dark?'light':'dark');
  };
}

function buildHero(){
  var hero=h('header','hero'); hero.id='top';
  var nWords=WORDS.length;
  hero.innerHTML='<div class="wrap"><div>'+
    '<span class="level">'+U.level+'</span>'+
    '<h1>'+U.title+'</h1><p>'+U.subtitle.replace('{n}',nWords)+'</p>'+
    '<div class="hero-meta"><span>🧠 '+nWords+' words</span><span>📰 '+U.article.words+' word article</span><span>🎮 '+U.acts.length+' games</span></div>'+
    '<div class="mascot"><span class="m">🚌</span><span class="bubble">'+U.mascot+'</span></div>'+
    '<a class="btn3d white" href="#sec-words">Let’s go! 🚀</a>'+
    '</div><div class="hero-emo" aria-hidden="true">'+U.emoji+'</div></div>';

function buildPath(){
  NODES = [{id:'sec-words', e:'🃏', l:'Word cards'}, {id:'sec-article', e:'📰', l:'Read'}];
  U.acts.forEach(function(a,i){ NODES.push({id:'act-'+i, e:a.e, l:a.short}); });
  NODES.push({id:'sec-write', e:'✍️', l:'Use it'});
  var wrap=h('div','wrap pathcard'); var card=h('div','card'); card.style.padding='12px 14px';
  card.innerHTML='<div style="font-weight:900;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 6px">Your learning path</div>';
  var p=h('div','path'); p.id='path';
  NODES.forEach(function(n){ var a=h('a','node'); a.href='#'+n.id; a.dataset.id=n.id; a.innerHTML='<span class="c">'+n.e+'</span><span class="l">'+n.l+'</span>'; p.appendChild(a); });
  var fin=h('a','node'); fin.href='#sec-finish'; fin.dataset.id='finish'; fin.innerHTML='<span class="c">🏆</span><span class="l">Trophy</span>'; p.appendChild(fin);
  card.appendChild(p); wrap.appendChild(card); app.appendChild(wrap);
}
function renderPath(){
  var done=0, nextSet=false;
  NODES.forEach(function(n){
    var el=document.querySelector('.node[data-id="'+n.id+'"]'); if(!el) return;
    var d=sectionDone(n.id); if(d) done++;
    el.classList.toggle('done', d); el.classList.remove('next');
    if(!d && !nextSet){ el.classList.add('next'); nextSet=true; }
  });
  var all = done===NODES.length;
  var f=document.querySelector('.node[data-id="finish"]'); if(f){ f.classList.toggle('done', all); f.classList.toggle('next', all); }
  if(pbar) pbar.style.width = Math.round(done/NODES.length*100)+'%';
  if(all) badge('champion');
}
function markDone(id, score, total){
  var first = !S.done[id];
  var prev = S.done[id] || {s:0,t:total};
  if(!S.done[id] || score/total >= prev.s/prev.t) S.done[id]={s:score, t:total};
  save(); renderPath(); renderFinish();
  var ex=document.getElementById(id); if(ex){ ex.classList.add('done'); var b=ex.querySelector('.best'); if(b) b.textContent='Best: '+S.done[id].s+'/'+S.done[id].t; }
  if(first && NODES.every(function(n){ return S.done[n.id]; })){
    setTimeout(function(){ sfx.win(); confetti(260); bigPop('🏆 Unit complete!<small>Scroll down for your trophy</small>'); }, 900);
  }
}

/* ---------------- word cards ---------------- */
function buildWords(){
  var sec=h('section'); sec.id='sec-words'; var wrap=h('div','wrap'); var card=h('div','card');
  card.innerHTML='<h2 class="sec-title">🃏 Word cards</h2><p class="lead">Tap a card to flip it and hear the word. Flip all '+WORDS.length+' cards to unlock your first badge!</p>';
  var cats=['All']; WORDS.forEach(function(w){ if(cats.indexOf(w.c)<0) cats.push(w.c); });
  var chips=h('div','chips');
  cats.forEach(function(c,i){ var b=h('button','chip'+(i===0?' on':''), c); b.onclick=function(){ chips.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); grid.querySelectorAll('.flip').forEach(function(f){ f.style.display = (c==='All'||f.dataset.c===c)?'':'none'; }); }; chips.appendChild(b); });
  var sh=h('button','chip','🔀 Shuffle'); sh.onclick=function(){ shuffle([].slice.call(grid.children)).forEach(function(n){ grid.appendChild(n); }); }; chips.appendChild(sh);
  var rs=h('button','chip','↩️ Flip back'); rs.onclick=function(){ grid.querySelectorAll('.flip').forEach(function(f){ f.classList.remove('on'); }); }; chips.appendChild(rs);
  card.appendChild(chips);
  var grid=h('div','fgrid');
  WORDS.forEach(function(w){
    var f=h('div','flip'+(S.flipped[w.w]?' seen':'')); f.dataset.c=w.c; f.tabIndex=0; f.setAttribute('role','button'); f.setAttribute('aria-label','Flip card: '+w.w);
    f.innerHTML='<div class="in"><div class="f"><button class="say" title="Listen">🔊</button><span class="emo">'+w.e+'</span><b>'+w.w+'</b></div>'+
      '<div class="b"><small>'+w.c+'</small>'+w.d+(w.x?'<i style="display:block;margin-top:6px;color:var(--muted)">“'+w.x+'”</i>':'')+'</div></div>';
    f.querySelector('.say').onclick=function(ev){ ev.stopPropagation(); say(w.w); };
    function flip(){ f.classList.toggle('on'); sfx.flip();
      if(f.classList.contains('on')){ say(w.w);

          if(Object.keys(S.flipped).length>=WORDS.length && !S.done['sec-words']){ cheer(f); confetti(120); markDone('sec-words',WORDS.length,WORDS.length); badge('cards'); }
        } } }
    f.onclick=flip; f.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
    grid.appendChild(f);
  });
  card.appendChild(grid);
  var cnt=h('div','counter','<span>🃏 <span class="n">0</span>/'+WORDS.length+' flipped</span><div class="mini"><i></i></div>');

function summary(body, score, total, retry, extra){

/* ---------------- stepper (one question at a time) ---------------- */
function Stepper(body, act, getItems, onDone, scene){
  function start(){
    var items=getItems(); var i=0, score=0, cur=null, state='answer';
    body.innerHTML='';
    var sc = scene ? scene.make(items.length) : null; if(sc) body.appendChild(sc.el);
    var dots=h('div','dots'); items.forEach(function(){ dots.appendChild(h('i')); }); body.appendChild(dots);
    var stage=h('div','stage'); body.appendChild(stage);
    var bar=h('div','checkbar'); var msg=h('div','msg'); var btn=h('button','btn3d','Check'); bar.appendChild(msg); bar.appendChild(btn); body.appendChild(bar);
    function show(){
      state='answer'; bar.className='checkbar'; msg.innerHTML=''; btn.textContent='Check'; btn.className='btn3d'; btn.disabled=true;
      dots.children[i].classList.add('cur'); stage.innerHTML='';
      var it=items[i]; var kind=it.k||act.kind||'mc';
      cur = KINDS[kind](it, stage, function(v){ if(state==='answer') btn.disabled=!v; }, submit);
    }
    function submit(){ if(state==='answer' && !btn.disabled) btn.click(); }
    btn.onclick=function(){
      if(state==='answer'){
        var r=cur.check(); state='next';
        dots.children[i].classList.remove('cur'); dots.children[i].classList.add(r.ok?'ok':'bad');
        bar.className='checkbar slideup '+(r.ok?'ok':'bad');
        if(r.ok){ score++; msg.innerHTML='<span class="h">✅ '+rnd(PRAISE)+'</span>'+(r.ex?r.ex:''); onRight(btn); btn.className='btn3d'; }
        else { msg.innerHTML='<span class="h">'+rnd(OOPS)+'</span>Correct answer: <b>'+r.correct+'</b>'+(r.ex?'<br>'+r.ex:''); onWrong(stage); btn.className='btn3d red'; }
        if(sc) sc.result(r.ok, score, i+1);
        btn.textContent = i===items.length-1 ? 'Finish 🎯' : 'Continue';
        btn.disabled=false; btn.focus({preventScroll:true});
      } else {
        i++;
        if(i<items.length) show();
        else { onDone(score, items.length); summary(body, score, items.length, start, sc&&sc.extra?sc.extra(score,items.length):''); }
      }
    };
    show();
  }
  start();
}

/* auto item generators */
function poolWords(a){ var ws=WORDS.filter(function(w){ return !a.cats || a.cats.indexOf(w.c)>=0; }); return ws; }
function genListen(a){
  var ws=shuffle(poolWords(a)).slice(0,a.n||8);
  return ws.map(function(w){ var same=WORDS.filter(function(x){return x!==w && x.c===w.c;}); var other=WORDS.filter(function(x){return x!==w;});
    var d=shuffle(same.length>=3?same:other).slice(0,3).map(function(x){return x.w;}); return {k:'listen', a:w.w, o:shuffle(d.concat(w.w))}; });
}
function genDef(a, n){
  var ws=shuffle(poolWords(a)).slice(0,n||a.n||10);
  return ws.map(function(w){ var same=WORDS.filter(function(x){return x!==w && x.c===w.c;}); var other=WORDS.filter(function(x){return x!==w;});
    var d=shuffle(same.length>=2?same:other).slice(0,2).map(function(x){return x.w;}); return {k:'mc', q:w.e+' '+w.d, o:shuffle(d.concat(w.w)), a:w.w}; });
}

/* ---------------- boards ---------------- */
var BOARDS = {
  quiz:function(body, a, done){
    var scene = a.scene==='race' ? raceScene(a.icon||'🚗', a.goal||'🏁', a.noflip) : a.scene==='penalty' ? penaltyScene() : null;
    Stepper(body, a, function(){
      var items = a.auto==='listen' ? genListen(a) : a.auto==='def' ? genDef(a) : (a.shuffle===false? a.items.slice() : shuffle(a.items));
      if(a.limit) items=items.slice(0,a.limit);
      return items;
    }, done, scene);
  },
  match:function(body, a, done){
    function start(){
      var pairs = a.pairs ? a.pairs.slice() : poolWords(a).map(function(w){ return [w.w, w.d]; });
      pairs=shuffle(pairs); if(a.limit) pairs=pairs.slice(0,a.limit);
      var rounds=[]; for(var i=0;i<pairs.length;i+=5) rounds.push(pairs.slice(i,i+5));
      if(rounds.length>1 && rounds[rounds.length-1].length<3){ var last=rounds.pop(); rounds[rounds.length-1]=rounds[rounds.length-1].concat(last); }
      var r=0, mistakes=0, t0=Date.now(), timer;
      body.innerHTML='';
      var head=h('div','mhead','<span>Round <b class="r">1</b>/'+rounds.length+'</span><span>❌ <b class="m">0</b></span><span>⏱ <b class="t">0</b>s</span>');

      timer=setInterval(function(){ if(!document.body.contains(head)) return clearInterval(timer); head.querySelector('.t').textContent=Math.round((Date.now()-t0)/1000); },1000);
      function round(){
        head.querySelector('.r').textContent=r+1; board.innerHTML='';
        var L=h('div','col'), R=h('div','col'), selL=null, selR=null, left=rounds[r].length;
        shuffle(rounds[r]).forEach(function(p,n){ var b=h('button','mt',p[0]); b.dataset.p=p[0]; L.appendChild(b); });
        shuffle(rounds[r]).forEach(function(p){ var b=h('button','mt def',p[1]); b.dataset.p=p[0]; R.appendChild(b); });
        board.appendChild(L); board.appendChild(R);
        function tryPair(){
          if(!selL||!selR) return;
          var a1=selL, b1=selR; selL=selR=null;

var IRR = {get:'g[eo]t(?:s|ting|ten)?', run:'r[au]n(?:s|ning)?', take:'t(?:ake|akes|aking|ook|aken)', set:'set(?:s|ting)?', break:'br(?:eak|eaks|eaking|oke|oken)', go:'(?:go|goes|going|went|gone)',
  lose:'(?:lose|loses|losing|lost)', win:'(?:win|wins|winning|won)', beat:'beat(?:s|ing|en)?', throw:'thr(?:ow|ows|owing|ew|own)', become:'bec(?:ome|omes|oming|ame)', meet:'(?:meet|meets|meeting|met)',
  make:'(?:make|makes|making|made)', do:'(?:do|does|doing|did|done)', pay:'(?:pay|pays|paying|paid)', choose:'(?:choose|chooses|choosing|chose|chosen)', sell:'(?:sell|sells|selling|sold)',
  let:'let(?:s|ting)?', have:'(?:have|has|having|had)', be:'(?:be|is|are|was|were|been|being|am)', shoot:'(?:shoot|shoots|shooting|shot)', bite:'(?:bite|bites|biting|bit|bitten)',
  pick:'pick(?:s|ed|ing)?', end:'end(?:s|ed|ing)?', fall:'(?:fall|falls|falling|fell|fallen)', drive:'(?:drive|drives|driving|drove|driven)', tell:'(?:tell|tells|telling|told)', put:'put(?:s|ting)?'};
function wordRegex(w){
  if(w.re) return new RegExp(w.re,'i');
  var src = (w.m || w.w).toLowerCase().replace(/\(.*?\)/g,'').replace(/\bsth\b/g,'').replace(/\s+/g,' ').trim();
  var toks = src.split(/[ \/-]+/).filter(Boolean);
  var parts = toks.map(function(t){ if(IRR[t]) return IRR[t]; if(['a','an','the','of','to','in','on','at','for','up','out','off','with','by','from','about','into'].indexOf(t)>=0) return t;
    var st=t.replace(/(ies|e|y|s)$/,''); if(st.length<3) st=t; return st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"(?:e|es|ed|d|s|ing|er|ers|y|ies|ied|ly|ily|ily|ely)?"; });
  return new RegExp('\\b'+parts.join('[\\s-]+(?:[a-z]+\\s+){0,2}?')+'\\b','i');
}
